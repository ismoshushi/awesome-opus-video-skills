const CATS = [["全部",""], ["① 用代码出片","①"], ["② 产品片/成片编辑","②"], ["③ 看视频/视频转 skill","③"], ["④ 调用外部视频模型","④"]];
const USES = [...new Set(DATA.map(d=>d.use))];
const STACKS = [...new Set(DATA.flatMap(d=>d.stack_tags))].filter(s=>s!=="视频理解"&&s!=="外部模型");
let cat="", use="", stack="", demoOnly=false, sort="default";
function chipBar(el, items, get, set){
  el.innerHTML = items.map(([label,val])=>`<button class="chip ${get()===val?'on':''}" data-v="${val}">${label}</button>`).join("");
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ set(b.dataset.v===get()?"":b.dataset.v); render(); });
}
function starNum(s){ const n = parseInt(String(s).replace(/,/g,""),10); return isNaN(n)?-1:n; }
function render(){
  chipBar(document.getElementById("catbar"), CATS, ()=>cat, v=>cat=v);
  const useCounts = {}; DATA.forEach(d=>useCounts[d.use]=(useCounts[d.use]||0)+1);
  chipBar(document.getElementById("usebar"), [["全部用途",""], ...USES.map(u=>[u+" "+useCounts[u], u])], ()=>use, v=>use=v);
  const stCounts = {}; DATA.forEach(d=>d.stack_tags.forEach(t=>stCounts[t]=(stCounts[t]||0)+1));
  chipBar(document.getElementById("stackbar"), [["全部渲染栈",""], ...STACKS.map(s=>[s+" "+(stCounts[s]||0), s])], ()=>stack, v=>stack=v);
  const q = document.getElementById("q").value.trim().toLowerCase();
  let list = DATA.filter(d =>
    (!cat || d.cat===cat) && (!use || d.use===use) && (!stack || d.stack_tags.includes(stack)) &&
    (!demoOnly || d.demo) &&
    (!q || (d.name+" "+d.one+" "+d.stack+" "+d.install).toLowerCase().includes(q)));
  if (sort==="stars") list = [...list].sort((a,b)=>starNum(b.stars)-starNum(a.stars));
  document.getElementById("count").textContent = "共 " + list.length + " 个（全部 118 个）";
  document.getElementById("empty").style.display = list.length ? "none" : "block";
  document.getElementById("grid").innerHTML = list.map(d => `
    <div class="card">
      <h3><a href="${d.url}" target="_blank" rel="noopener">${d.name}</a></h3>
      <div class="badges">
        <span class="badge">${{ "①":"① 用代码出片","②":"② 产品片/成片编辑","③":"③ 看视频/视频转 skill","④":"④ 调用外部视频模型" }[d.cat]}</span>
        <span class="badge">${d.use}</span>
        <span class="badge gold">⭐ ${d.stars}</span>
        <span class="badge">${d.license}</span>
        ${d.f55==="✅" ? '<span class="badge green">Opus 5.5 ✅</span>' : d.f55==="⚠️" ? '<span class="badge warn">Opus 5.5 ⚠️</span>' : ""}
      </div>
      <div class="one">${d.one}</div>
      <div class="stack">渲染栈：${d.stack}</div>
      ${d.demo ? `<div class="demo-label">🎬 样片（用本 skill 实测渲染）</div><video controls preload="none" src="${d.demo}"></video>` : ""}
      <div class="install"><span>${d.install}</span><button class="copy" data-c="${d.install.replace(/"/g,"&quot;")}">复制</button></div>
    </div>`).join("");
  document.querySelectorAll(".copy").forEach(b=>b.onclick=()=>{ navigator.clipboard.writeText(b.dataset.c).then(()=>{ b.textContent="已复制"; setTimeout(()=>b.textContent="复制",1200); }); });
}
document.getElementById("q").oninput = render;
document.getElementById("demoOnly").onchange = e => { demoOnly = e.target.checked; render(); };
document.getElementById("sort").onchange = e => { sort = e.target.value; render(); };
document.getElementById("reset").onclick = ()=>{ cat=""; use=""; stack=""; demoOnly=false; document.getElementById("demoOnly").checked=false; document.getElementById("q").value=""; render(); };
render();
</script>
